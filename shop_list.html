<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trashbusters - ショップ一覧</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <span>ショップ</span>
      <span>9:30</span>
    </header>

    <main class="main-content">
      <div class="search-bar">
        <input type="text" id="search-input" class="search-input" placeholder="検索欄" value="土丞邊町">
        <button id="btn-clear-search" class="search-clear-btn">✕</button>
      </div>

      <div class="product-grid">
        <div class="product-card">
          <img src="./images/product_item1.png" alt="商品" class="product-img image-placeholder">
          <div style="font-size: 11px; margin: 4px 0;">土丞邊町サンプル商店</div>
          <a href="./shop_detail.html" class="btn" style="font-size: 11px; padding: 4px 8px;">交換</a>
        </div>
        <div class="product-card">
          <img src="./images/product_item2.png" alt="商品" class="product-img image-placeholder">
          <div style="font-size: 11px; margin: 4px 0;">丞辺海岸マート</div>
          <a href="./shop_detail.html" class="btn" style="font-size: 11px; padding: 4px 8px;">交換</a>
        </div>
        <div class="product-card">
          <div class="product-img image-placeholder">匹荷駅前カフェ</div>
          <div style="font-size: 11px; margin: 4px 0;">匹荷駅前カフェ</div>
          <a href="./shop_detail.html" class="btn" style="font-size: 11px; padding: 4px 8px;">交換</a>
        </div>
        <div class="product-card">
          <div class="product-img image-placeholder">サンプル商店</div>
          <div style="font-size: 11px; margin: 4px 0;">連携企業商品</div>
          <a href="./shop_detail.html" class="btn" style="font-size: 11px; padding: 4px 8px;">交換</a>
        </div>
      </div>
    </main>

    
    <div class="bottom-nav-container">
      <a href="./index.html" class="btn-home-back">ホームへ戻る</a>
      <nav class="nav-bar">
        <a href="./settings.html" class="nav-item">
          <img src="./images/icon_setting.png" alt="設定" class="nav-icon image-placeholder" onerror="this.replaceWith(document.createElement('div')); this.classList.add('nav-icon'); this.textContent='設';">
          設定
        </a>
        <a href="./game.html" class="nav-item">
          <img src="./images/icon_game.png" alt="ゲーム" class="nav-icon image-placeholder" onerror="this.replaceWith(document.createElement('div')); this.classList.add('nav-icon'); this.textContent='遊';">
          ゲーム
        </a>
        <a href="./camera.html" class="nav-camera-btn">
          📷
        </a>
        <a href="./ranking.html" class="nav-item">
          <img src="./images/icon_ranking.png" alt="ランキング" class="nav-icon image-placeholder" onerror="this.replaceWith(document.createElement('div')); this.classList.add('nav-icon'); this.textContent='順';">
          ランキング
        </a>
        <a href="./mail_list.html" class="nav-item">
          <img src="./images/icon_mail.png" alt="メール" class="nav-icon image-placeholder" onerror="this.replaceWith(document.createElement('div')); this.classList.add('nav-icon'); this.textContent='信';">
          メール
        </a>
      </nav>
    </div>

  </div>
  <script src="./script.js"></script>
</body>
</html>
