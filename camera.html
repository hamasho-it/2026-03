<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>撮影 - Trashbusters</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <div class="status-bar">
      <span>9:30</span>
      <span>📶 🔋</span>
    </div>
    
    <div style="background:#000; height:36px; display:flex; justify-content:space-around; align-items:center; color:#fff;">
      <span>⚡</span><span>🔄</span><span>⚙</span><span>☰</span>
    </div>
    <main class="main-content" style="background:#222; position:relative; justify-content:center; align-items:center;">
      <div style="width: 200px; height: 200px; border: 2px dashed #fff; display:flex; justify-content:center; align-items:center; color:#fff; font-size:32px;">
        +
      </div>
      <div class="img-placeholder" style="position:absolute; top:10px; right:10px; width:40px; height:40px; margin:0;">
        <img src="./images/icon_camera.png" alt="撮影">
      </div>
    </main>
    <div style="background:#000; padding:20px; display:flex; justify-content:space-around; align-items:center;">
      <div style="width:30px; height:30px; border:1px solid #fff;"></div>
      <a href="./ai_detect.html" style="width:60px; height:60px; background:red; border-radius:50%; display:inline-block; border:3px solid #fff;"></a>
      <div style="width:30px; height:30px; border:1px solid #fff;"></div>
    </div>

    
    <footer class="footer-nav">
      <a href="./settings.html" class="nav-item">
        <div class="nav-icon"><img src="./images/icon_settings.png" alt="設定" onerror="this.remove()">⚙</div>
        <span>設定</span>
      </a>
      <a href="./game_list.html" class="nav-item">
        <div class="nav-icon"><img src="./images/icon_game.png" alt="ゲーム" onerror="this.remove()">🎮</div>
        <span>ゲーム</span>
      </a>
      <a href="./ranking_list.html" class="nav-item">
        <div class="nav-icon"><img src="./images/icon_ranking.png" alt="ランキング" onerror="this.remove()">👑</div>
        <span>ランキング</span>
      </a>
      <a href="./mail_list.html" class="nav-item">
        <div class="nav-icon"><img src="./images/icon_mail.png" alt="メール" onerror="this.remove()">✉</div>
        <span>メール</span>
      </a>
      <a href="./photo_prep.html" class="nav-item">
        <div class="nav-icon" style="background:#333; color:#fff;"><img src="./images/icon_camera.png" alt="撮影" onerror="this.remove()">📷</div>
        <span>撮影</span>
      </a>
    </footer>
  </div>
  <script src="./script.js"></script>
</body>
</html>
