<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trashbusters - 設定</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <span>設定</span>
      <span>9:30</span>
    </header>

    <main class="main-content">
      <div class="setting-row">
        <span>設定1</span>
        <div class="toggle-btn">
          <button class="active">オン</button>
          <button>オフ</button>
        </div>
      </div>
      <div class="setting-row">
        <span>設定2</span>
        <div class="toggle-btn">
          <button class="active">オン</button>
          <button>オフ</button>
        </div>
      </div>
      <div class="setting-row">
        <span>設定3</span>
        <div class="toggle-btn">
          <button>オン</button>
          <button class="active">オフ</button>
        </div>
      </div>
    </main>

    
    <div class="bottom-nav-container">
      <a href="./index.html" class="btn-home-back">ホームへ戻る</a>
      <nav class="nav-bar">
        <a href="./settings.html" class="nav-item">
          <img src="./images/icon_setting.png" alt="設定" class="nav-icon image-placeholder" onerror="this.replaceWith(document.createElement('div')); this.classList.add('nav-icon'); this.textContent='設';">
          設定
        </a>
        <a href="./game.html" class="nav-item">
          <img src="./images/icon_game.png" alt="ゲーム" class="nav-icon image-placeholder" onerror="this.replaceWith(document.createElement('div')); this.classList.add('nav-icon'); this.textContent='遊';">
          ゲーム
        </a>
        <a href="./camera.html" class="nav-camera-btn">
          📷
        </a>
        <a href="./ranking.html" class="nav-item">
          <img src="./images/icon_ranking.png" alt="ランキング" class="nav-icon image-placeholder" onerror="this.replaceWith(document.createElement('div')); this.classList.add('nav-icon'); this.textContent='順';">
          ランキング
        </a>
        <a href="./mail_list.html" class="nav-item">
          <img src="./images/icon_mail.png" alt="メール" class="nav-icon image-placeholder" onerror="this.replaceWith(document.createElement('div')); this.classList.add('nav-icon'); this.textContent='信';">
          メール
        </a>
      </nav>
    </div>

  </div>
  <script src="./script.js"></script>
</body>
</html>
