<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>設定 - Trashbusters</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <div class="status-bar">
      <span>9:30</span>
      <span>📶 🔋</span>
    </div>
    
    <header class="app-header">
      <div class="header-title">設定</div>
    </header>
    <main class="main-content">
      <div class="toggle-row">
        <span>設定1（通知設定）</span>
        <button class="toggle-btn active">オン</button>
      </div>
      <div class="toggle-row">
        <span>設定2（位置情報）</span>
        <button class="toggle-btn active">オン</button>
      </div>
      <div class="toggle-row" style="margin-bottom: 20px;">
        <span>設定3（ダークモード）</span>
        <button class="toggle-btn">オフ</button>
      </div>
      <a href="./settings_detail.html" class="btn">設定詳細</a>
      <a href="./index.html" class="btn btn-return-home">ホームへ戻る</a>
    </main>

    
    <footer class="footer-nav">
      <a href="./settings.html" class="nav-item">
        <div class="nav-icon"><img src="./images/icon_settings.png" alt="設定" onerror="this.remove()">⚙</div>
        <span>設定</span>
      </a>
      <a href="./game_list.html" class="nav-item">
        <div class="nav-icon"><img src="./images/icon_game.png" alt="ゲーム" onerror="this.remove()">🎮</div>
        <span>ゲーム</span>
      </a>
      <a href="./ranking_list.html" class="nav-item">
        <div class="nav-icon"><img src="./images/icon_ranking.png" alt="ランキング" onerror="this.remove()">👑</div>
        <span>ランキング</span>
      </a>
      <a href="./mail_list.html" class="nav-item">
        <div class="nav-icon"><img src="./images/icon_mail.png" alt="メール" onerror="this.remove()">✉</div>
        <span>メール</span>
      </a>
      <a href="./photo_prep.html" class="nav-item">
        <div class="nav-icon" style="background:#333; color:#fff;"><img src="./images/icon_camera.png" alt="撮影" onerror="this.remove()">📷</div>
        <span>撮影</span>
      </a>
    </footer>
  </div>
  <script src="./script.js"></script>
</body>
</html>
