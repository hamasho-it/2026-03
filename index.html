<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム - Trashbusters</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <div class="status-bar">
      <span>9:30</span>
      <span>📶 🔋</span>
    </div>
    
    <header class="app-header">
      <div class="header-title">Trashbusters</div>
      <div class="point-display">獲得ポイント 1500 Pt</div>
    </header>
    <main class="main-content" style="align-items: center; justify-content: center;">
      <a href="./shop_list.html" style="text-decoration:none; color:inherit; text-align:center; margin-bottom: 40px;">
        <div class="img-placeholder" style="width: 140px; height: 140px; border-radius: 50%;">
          <img src="./images/icon_shop.png" alt="ショップ">
        </div>
        <div style="font-size: 18px; font-weight: bold; margin-top: 8px;">ショップ</div>
      </a>
    </main>

    
    <footer class="footer-nav">
      <a href="./settings.html" class="nav-item">
        <div class="nav-icon"><img src="./images/icon_settings.png" alt="設定" onerror="this.remove()">⚙</div>
        <span>設定</span>
      </a>
      <a href="./game_list.html" class="nav-item">
        <div class="nav-icon"><img src="./images/icon_game.png" alt="ゲーム" onerror="this.remove()">🎮</div>
        <span>ゲーム</span>
      </a>
      <a href="./ranking_list.html" class="nav-item">
        <div class="nav-icon"><img src="./images/icon_ranking.png" alt="ランキング" onerror="this.remove()">👑</div>
        <span>ランキング</span>
      </a>
      <a href="./mail_list.html" class="nav-item">
        <div class="nav-icon"><img src="./images/icon_mail.png" alt="メール" onerror="this.remove()">✉</div>
        <span>メール</span>
      </a>
      <a href="./photo_prep.html" class="nav-item">
        <div class="nav-icon" style="background:#333; color:#fff;"><img src="./images/icon_camera.png" alt="撮影" onerror="this.remove()">📷</div>
        <span>撮影</span>
      </a>
    </footer>
  </div>
  <script src="./script.js"></script>
</body>
</html>
